<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gallery | Ban Oudomphong Farm Stay</title>
  <meta name="description" content="Photo gallery of Ban Oudomphong Farm Stay, Udon Thani, Thailand.">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="site-header"></div>

  <section class="page-hero" style="background-image:url('nature/IMG_9752.JPG')">
    <div class="hero-content">
      <span class="eyebrow">Gallery</span>
      <h1>Moments at Ban Oudomphong</h1>
    </div>
  </section>

  <section class="section">
    <div class="container">
      <div class="narrow center">
        <span class="eyebrow">Photo Gallery</span>
        <h2>A Glimpse of Farm Life</h2>
        <p>Select any photograph to view it in full.</p>
      </div>

      <!-- Put your 6 gallery photos in a folder called "gallery" named 1.jpg to 6.jpg.
           Photos are shown in full, never cropped. Edit captions as you like. -->
      <div class="gallery">
        <figure><img class="zoom" src="gallery/1.jpg" alt="Gallery photo 1"><figcaption>The Farm</figcaption></figure>
        <figure><img class="zoom" src="gallery/2.jpg" alt="Gallery photo 2"><figcaption>The Lake</figcaption></figure>
        <figure><img class="zoom" src="gallery/3.jpg" alt="Gallery photo 3"><figcaption>Accommodation</figcaption></figure>
        <figure><img class="zoom" src="gallery/4.jpg" alt="Gallery photo 4"><figcaption>Dining</figcaption></figure>
        <figure><img class="zoom" src="gallery/5.jpg" alt="Gallery photo 5"><figcaption>Experiences</figcaption></figure>
        <figure><img class="zoom" src="gallery/6.jpg" alt="Gallery photo 6"><figcaption>Sunset</figcaption></figure>
      </div>
    </div>
  </section>

  <section class="cta-band" style="background-image:url('nature/lake.jpg')">
    <span class="eyebrow">Reservations</span>
    <h2>See It for Yourself</h2>
    <p>Call +66 96 195 6282 or send us a request online.</p>
    <a href="index.html#contact" class="btn">Reserve Your Stay</a>
  </section>

  <div id="site-footer"></div>
  <script src="script.js"></script>

</html>
